[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwriter-research"
version = "0.1.0"
description = "Official implementation of the Ghostwriter two-phase attack"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ghostwriter authors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
deepseek = ["openai>=1.0"]
all = ["openai>=1.0", "anthropic>=0.40"]

[project.scripts]
ghostwriter-repackage = "ghostwriter.repackage_cli:main"
ghostwriter-inject = "ghostwriter.inject_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
